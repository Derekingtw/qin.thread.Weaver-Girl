services:
  postgres:
    image: postgres:16-alpine
    container_name: qinshixian-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: qinshixian
      POSTGRES_USER: qinshixian
      POSTGRES_PASSWORD: qinshixian_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qinshixian -d qinshixian"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:7-alpine
    container_name: qinshixian-keyvalue-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  valkey_data:
