services:
  - type: keyvalue
    name: qinshixian-keyvalue-prod
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: qinshixian-api-prod
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate && npm run build -w @knit/shared && npm run build -w apps-api
    startCommand: node -e "const fs=require('fs'); for (const f of ['prisma/migrations/migration_lock.toml','prisma/migrations/20260513000000_init/migration.sql','prisma/migrations/20260513030000_homepage_ads_locale/migration.sql']) { let s=fs.readFileSync(f,'utf8').replace(/^\uFEFF/,''); fs.writeFileSync(f,s); }" && npx prisma migrate deploy && NODE_PATH=apps/api/node_modules:node_modules node apps/api/dist/apps/api/src/main.js
    healthCheckPath: /web/home
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qinshixian-postgres-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: qinshixian-keyvalue-prod
          property: connectionString
      - fromGroup: qinshixian-prod-env

  - type: web
    name: qinshixian-web-prod
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build -w @knit/shared && npm run build -w @knit/ui && npm run build -w apps-web
    startCommand: npm run start -w apps-web
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://qinshixian-api-prod.onrender.com
      - key: WEB_API_BASE_URL
        value: https://qinshixian-api-prod.onrender.com

  - type: web
    name: qinshixian-admin-web-prod
    runtime: static
    buildCommand: npm install && npm install @rollup/rollup-linux-x64-gnu@4.60.3 --no-save && npm run build -w @knit/shared && npm run build -w @knit/ui && npm run build -w apps-admin-web
    staticPublishPath: apps/admin-web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://qinshixian-api-prod.onrender.com

databases:
  - name: qinshixian-postgres-prod
    plan: free
    region: singapore
    databaseName: qinshixian
    user: qinshixian

envVarGroups:
  - name: qinshixian-prod-env
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PHONE_HASH_SALT
        generateValue: true
      - key: MOCK_SMS_CODE
        value: "123456"
      - key: MOCK_PAYMENT_AUTO_PAID
        value: "false"
      - key: OBJECT_STORAGE_PROVIDER
        value: "mock"
