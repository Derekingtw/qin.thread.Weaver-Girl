services:
  - type: keyvalue
    name: qinshixian-keyvalue-prod
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: qinshixian-api-prod
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npx prisma generate && npm run build -w @knit/shared && npm run build -w apps-api
    startCommand: npx prisma migrate deploy && npm run start:prod -w apps-api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qinshixian-postgres-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: qinshixian-keyvalue-prod
          property: connectionString
      - fromGroup: qinshixian-prod-env

  - type: web
    name: qinshixian-web-prod
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build -w @knit/shared && npm run build -w @knit/ui && npm run build -w apps-web
    startCommand: npm run start -w apps-web
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://qinshixian-api-prod.onrender.com
      - key: WEB_API_BASE_URL
        value: https://qinshixian-api-prod.onrender.com

  - type: web
    name: qinshixian-admin-web-prod
    runtime: static
    buildCommand: npm ci && npm run build -w @knit/shared && npm run build -w @knit/ui && npm run build -w apps-admin-web
    staticPublishPath: apps/admin-web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://qinshixian-api-prod.onrender.com

databases:
  - name: qinshixian-postgres-prod
    plan: starter
    region: singapore
    databaseName: qinshixian
    user: qinshixian

envVarGroups:
  - name: qinshixian-prod-env
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PHONE_HASH_SALT
        generateValue: true
      - key: MOCK_SMS_CODE
        value: "123456"
      - key: MOCK_PAYMENT_AUTO_PAID
        value: "false"
      - key: OBJECT_STORAGE_PROVIDER
        value: "mock"
