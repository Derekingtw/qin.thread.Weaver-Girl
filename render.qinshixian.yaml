services:
  - type: keyvalue
    name: qinshixian-keyvalue-prod
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: qinshixian-api-prod
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npx prisma generate && npm run build -w @knit/shared && npm run build -w apps-api
    startCommand: npx prisma migrate deploy && NODE_PATH=apps/api/node_modules:node_modules node apps/api/dist/apps/api/src/main.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qinshixian-postgres-prod
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: qinshixian-keyvalue-prod
          property: connectionString
      - fromGroup: qinshixian-prod-env

  - type: web
    name: qinshixian-web-prod
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build -w @knit/shared && npm run build -w @knit/ui && npm run build -w apps-web
    startCommand: cd apps/web && npx next start -p $PORT
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://qinshixian-api-prod.onrender.com
      - key: WEB_API_BASE_URL
        value: https://qinshixian-api-prod.onrender.com

  - type: web
    name: qinshixian-admin-web-prod
    runtime: static
    buildCommand: npm install && npm install @rollup/rollup-linux-x64-gnu@4.60.3 --no-save && npm run build -w @knit/shared && npm run build -w @knit/ui && npm run build -w apps-admin-web
    staticPublishPath: apps/admin-web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://qinshixian-api-prod.onrender.com

databases:
  - name: qinshixian-postgres-prod
    plan: starter
    region: singapore
    databaseName: qinshixian
    user: qinshixian

envVarGroups:
  - name: qinshixian-prod-env
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PHONE_HASH_SALT
        generateValue: true
      - key: MOCK_SMS_CODE
        value: "123456"
      - key: MOCK_PAYMENT_AUTO_PAID
        value: "false"
      - key: OBJECT_STORAGE_PROVIDER
        value: "mock"
      - key: MEDIA_MAX_SIZE_MB
        value: "5"
      - key: CORS_ORIGINS
        value: "https://qinshixian-web-prod.onrender.com,https://qinshixian-admin-web-prod.onrender.com"
      - key: S3_BUCKET
        value: ""
      - key: S3_REGION
        value: ""
      - key: S3_ACCESS_KEY_ID
        value: ""
      - key: S3_SECRET_ACCESS_KEY
        value: ""
      - key: S3_PUBLIC_BASE_URL
        value: ""
      - key: R2_ACCOUNT_ID
        value: ""
      - key: R2_BUCKET
        value: ""
      - key: R2_ACCESS_KEY_ID
        value: ""
      - key: R2_SECRET_ACCESS_KEY
        value: ""
      - key: R2_PUBLIC_BASE_URL
        value: ""
      - key: COS_BUCKET
        value: ""
      - key: COS_REGION
        value: ""
      - key: COS_SECRET_ID
        value: ""
      - key: COS_SECRET_KEY
        value: ""
      - key: COS_PUBLIC_BASE_URL
        value: ""
      - key: OSS_BUCKET
        value: ""
      - key: OSS_REGION
        value: ""
      - key: OSS_ACCESS_KEY_ID
        value: ""
      - key: OSS_ACCESS_KEY_SECRET
        value: ""
      - key: OSS_PUBLIC_BASE_URL
        value: ""
